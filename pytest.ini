; pytest 全局配置 (CI 与本地共用).
;
; - testpaths=tests: 在仓库根直接 `pytest` 即跑全量, 行为与 CI 一致;
; - addopts=-q: 与既有本地/CI 调用习惯一致 (显式传 -v 可覆盖);
; - filterwarnings=default: 警告照常显示但**不吞**（不 ignore），CI 另外用
;   `-W error::DeprecationWarning` 把弃用警告升级为失败 —— Python 3.13/3.14
;   的破坏性变更因此在迁版本前就能暴露;
; - 不设 coverage 阈值: 覆盖率只做可见性（ci.yml --cov-report=term-missing）,
;   避免为了数字写无意义断言。
[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    default
