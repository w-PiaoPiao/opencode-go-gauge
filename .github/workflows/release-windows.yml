# Windows 单文件 exe 自动构建 (旧式单平台发布; 统一发布见 release.yml): 推送
# v*-windows tag 时触发, 构建产物自动附到同名 release.
#
# 与统一发布一样先过 preflight: 全量 pytest + tag 去 -windows 后缀后必须等于
# 桌面 __version__。此前单平台 hotfix 链完全没有测试/版本校验, 可能发出
# __version__ 仍是旧值的包（已安装客户端于是"永远有新版本"循环）。
# 构建参数统一在 scripts/build.py（与 build.bat 共用同一实现）。
name: release-windows

on:
  push:
    tags: ["v*-windows"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ --timeout=120 -W error::DeprecationWarning

      - name: Verify tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          python scripts/check_versions.py
          --tag "$GITHUB_REF_NAME" --platform desktop

  build:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # 构建 job 会执行第三方依赖 (pip), 不把 token 落进 .git/config
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.lock.txt

      - name: Install build dependencies
        run: python -m pip install -q -r requirements-windows.lock.txt

      - name: Build GoGauge.exe
        run: python scripts/build.py --platform windows --repo "${{ github.repository }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GoGauge-windows-exe
          path: dist/GoGauge.exe
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoGauge-windows-exe

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # v2.1.0b-windows -> 资产命名 GoGauge-v2.1.0b-windows.exe
          VER="${TAG#v}"; VER="${VER%-windows}"
          mv GoGauge.exe "GoGauge-v${VER}-windows.exe"
          ls -l
          gh release upload "$TAG" "GoGauge-v${VER}-windows.exe" --clobber || \
            gh release create "$TAG" "GoGauge-v${VER}-windows.exe" \
              --title "GoGauge $TAG" --generate-notes
