# HarmonyOS HAP 自动构建: 推送 v*-harmony tag 时触发 (镜像 release-android.yml)。
#
# ⚠️ 前提 (公共 runner 需要):
#   1. 安装 HarmonyOS 命令行工具链 (hvigor/ohpm/node) 与 SDK (API 24) —
#      建议以自托管 runner + 本机 DevEco 工具目录运行, 或在 Actions 中下载
#      developer command-line tools (HarmonyOS Command Line Tools)。
#   2. 签名材料 (release.p12 / 签名 Profile p7b / 证书 cer) 存入仓库 Secrets:
#      HAP_STORE_FILE / HAP_STORE_PASSWORD / HAP_KEY_ALIAS / HAP_KEY_PASSWORD /
#      HAP_PROFILE_P7B / HAP_SIGN_CER  (详见 harmonyos/docs/agc-release-checklist.md)
#   3. 构建时在 build-profile.json5 注入 signingConfigs (本地调试可跳过, 产物为 unsigned)。

name: release-harmonyos

on:
  push:
    tags: ["v*-harmony"]
  workflow_dispatch:

permissions:
  contents: read  # 构建 job 只需要读仓库; 写权限下放到 release job

jobs:
  build:
    runs-on: ubuntu-latest  # 或自托管 (已装 DevEco 命令行工具链)
    # 提到 job 级: 步骤级 if 读不到本步骤自己 env 中定义的值
    env:
      HAP_STORE_PASSWORD: ${{ secrets.HAP_STORE_PASSWORD }}
      HAP_KEY_ALIAS: ${{ secrets.HAP_KEY_ALIAS }}
      HAP_KEY_PASSWORD: ${{ secrets.HAP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup HarmonyOS toolchain
        run: |
          # 占位: 公共 runner 需先安装 hvigor/ohpm/node 与 SDK(API 24)。
          # 自托管 runner 可改用本机 DevEco 工具目录:
          #   echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME" >> $GITHUB_ENV
          echo "DEVECO_SDK_HOME=$(pwd)/harmonyos-sdk" >> $GITHUB_ENV
          echo "NODE_HOME=$(which node)" >> $GITHUB_ENV

      - name: ohpm install
        working-directory: harmonyos
        run: ohpm install

      # 签名脚本 (scripts/inject-signing.sh) 要的是**文件路径**, 而 Secrets 存的是
      # 材料内容 —— 原先直接把 secret 当路径传给脚本, 三个文件类 secret 全部落空,
      # inject-signing.sh 的 ': "${VAR:?}"' 直接退出, build job 必然失败,
      # 依赖它的 release job 也就永远发不出 HAP。
      - name: Materialize signing material
        if: env.HAP_STORE_PASSWORD != ''
        working-directory: harmonyos
        env:
          HAP_STORE_FILE_RAW: ${{ secrets.HAP_STORE_FILE }}
          HAP_PROFILE_P7B_RAW: ${{ secrets.HAP_PROFILE_P7B }}
          HAP_SIGN_CER_RAW: ${{ secrets.HAP_SIGN_CER }}
        run: |
          set -euo pipefail
          mkdir -p .signing
          # 兼容两种形态: 值以 / 开头且文件存在 -> 自托管 runner 直接给路径;
          # 否则视为 base64 材料内容, 解码落盘后导出路径。
          materialize() {
            local raw="$1" out="$2"
            if [[ "$raw" == /* && -f "$raw" ]]; then printf '%s' "$raw"; return; fi
            printf '%s' "$raw" | base64 -d > ".signing/$out"
            printf '%s' "$PWD/.signing/$out"
          }
          {
            echo "HAP_STORE_FILE=$(materialize "$HAP_STORE_FILE_RAW" release.p12)"
            echo "HAP_PROFILE_P7B=$(materialize "$HAP_PROFILE_P7B_RAW" release.p7b)"
            echo "HAP_SIGN_CER=$(materialize "$HAP_SIGN_CER_RAW" release.cer)"
          } >> "$GITHUB_ENV"

      - name: Inject signing config (if secrets present)
        working-directory: harmonyos
        if: env.HAP_STORE_PASSWORD != ''
        env:
          HAP_STORE_FILE: ${{ env.HAP_STORE_FILE }}
          HAP_PROFILE_P7B: ${{ env.HAP_PROFILE_P7B }}
          HAP_SIGN_CER: ${{ env.HAP_SIGN_CER }}
        run: bash scripts/inject-signing.sh

      - name: Build signed HAP
        working-directory: harmonyos
        run: ./hvigorw --mode module -p product=default assembleHap --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: GoGauge-harmonyos-hap
          path: harmonyos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 写权限只给真正创建/更新 release 的 job
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"; VER="${VER%-harmony}"
          HAP=$(ls *.hap | head -1)
          mv "$HAP" "GoGauge-v${VER}-harmony.hap"
          gh release upload "$TAG" "GoGauge-v${VER}-harmony.hap" --clobber || \
            gh release create "$TAG" "GoGauge-v${VER}-harmony.hap" \
              --title "GoGauge $TAG" --generate-notes