# HarmonyOS HAP 自动构建: 推送 v*-harmony tag 时触发 (镜像 release-android.yml)。
# 注: 鸿蒙暂未纳入统一发布 (release.yml), 仍走本单平台流程; 该 workflow 从未成功
# 运行过（仓库里没有任何 v*-harmony tag, Actions 也没有运行记录）。
#
# ⚠️ 前提 (公共 runner 需要):
#   1. 安装 HarmonyOS 命令行工具链 (hvigor/ohpm/node) 与 SDK (API 24) —
#      建议以自托管 runner + 本机 DevEco 工具目录运行。
#   2. 本 workflow 只产 **unsigned** HAP/.app 作为 CI 构建产物（GitHub Release 附件）。
#      AppGallery 上架必须用发布证书 + 发布 Profile 签名的 .app，签名材料敏感且需
#      hvigor 兼容的加密格式（material/ 目录），请在本地按 harmonyos/scripts/
#      {gen-signing-material.js,inject-signing.sh} + docs/release-guide.md 完成；
#      CI 不存放签名密钥。
#
# 本文件相对历史版本的修复:
# - 签名注入步骤原写作 step 级 `if: env.HAP_STORE_PASSWORD != ''` —— GitHub 的
#   step 级 `if` 看不到**该 step 自己**的 env（if 在 step env 应用之前求值），
#   条件恒为假: 即使配了 secrets 也永远 skip, 最终上传未签名 HAP 却按正式资产命名。
#   现在把 secrets 提到 job 级 env, if 才能正确读到。
# - 公共 ubuntu runner 没装 ohpm/hvigor/SDK 时, 原 workflow 会在 `ohpm install`
#   处抛一个难以理解的数据; 现在先显式检查工具链与（tag 发布时）签名 secrets,
#   给出可操作的 ::error:: 说明。
# - 增加 timeout-minutes; 顶层权限只读, 只有 release job 需要 contents: write。
name: release-harmonyos

on:
  push:
    tags: ["v*-harmony"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # 默认公共 runner 未装工具链 -> 工具链检查步骤会给出明确错误; 自托管 runner
    # 或自行安装 Command Line Tools 后可直接运行。workflow_dispatch 也可用于在分支上验证构建。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check HarmonyOS toolchain
        # 失败信息必须可操作: 不是 "ohpm: command not found" 这种天书
        run: |
          set -euo pipefail
          missing=()
          command -v ohpm  >/dev/null 2>&1 || missing+=("ohpm")
          command -v node  >/dev/null 2>&1 || missing+=("node")
          [ -n "${DEVECO_SDK_HOME:-}" ] || missing+=("DEVECO_SDK_HOME(env)")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 HarmonyOS 工具链: ${missing[*]}。公共 ubuntu runner 不预装 DevEco 工具链/HarmonyOS SDK(API 24); 请改用自托管 runner, 或先安装 HarmonyOS Command Line Tools 并导出 DEVECO_SDK_HOME/NODE_HOME（见 harmonyos/README.md 的「命令行构建」）。"
            exit 1
          fi
          echo "HarmonyOS toolchain OK: ohpm=$(command -v ohpm) node=$(command -v node) sdk=$DEVECO_SDK_HOME"

      - name: ohpm install
        working-directory: harmonyos
        run: ohpm install

      - name: Run hypium unit tests
        # harmonyos/scripts/build.sh test -> hvigorw test（hypium 套件, 含
        # QuotaParser/UsageParser/Fmt/SyncDao 等纯逻辑用例）
        working-directory: harmonyos
        run: bash scripts/build.sh test

      - name: Build HAP (debug, 侧载/调试)
        working-directory: harmonyos
        run: bash scripts/build.sh hap

      - name: Build App Pack (release .app, unsigned — 签名请本地完成)
        # 产物为 unsigned .app；上架前需用发布证书/Profile 签名（见 docs/release-guide.md）。
        working-directory: harmonyos
        run: bash scripts/build.sh app

      - uses: actions/upload-artifact@v4
        with:
          name: GoGauge-harmonyos-packages
          path: |
            harmonyos/entry/build/default/outputs/default/*.hap
            harmonyos/build/outputs/default/*.app
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # v1.0.0-harmony -> GoGauge-v1.0.0-harmony.hap / -harmony.app
          VER="${TAG#v}"; VER="${VER%-harmony}"
          HAP=$(ls *.hap 2>/dev/null | head -1 || true)
          APP=$(ls *.app 2>/dev/null | head -1 || true)
          if [ -z "$HAP" ] && [ -z "$APP" ]; then
            echo "::error::没有找到 HAP/APP 产物"
            exit 1
          fi
          [ -n "$HAP" ] && mv "$HAP" "GoGauge-v${VER}-harmony.hap"
          [ -n "$APP" ] && mv "$APP" "GoGauge-v${VER}-harmony.app"
          ls -l
          gh release upload "$TAG" GoGauge-v${VER}-harmony.* --clobber || \
            gh release create "$TAG" GoGauge-v${VER}-harmony.* \
              --title "GoGauge $TAG" --generate-notes
