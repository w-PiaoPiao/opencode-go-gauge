# Android APK 自动构建 (旧式单平台发布; 统一发布见 release.yml): 推送
# v*-android tag 时触发, 构建产物自动附到同名 release.
#
# 与统一发布一样先过 preflight: 全量 pytest + tag 去 -android 后缀后必须**等于**
# Android versionName（Android 是本 workflow 的主体, 不允许滞后: 否则产物的
# 版本号与 tag 不符, 版本检查/更新提示会错乱）。
# 签名使用仓库内 debug.keystore (个人侧载用; 上架 Play 需替换正式 keystore).
# 权限: 顶层只读, 只有 release job 需要 contents: write。
name: release-android

on:
  push:
    tags: ["v*-android"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ --timeout=120 -W error::DeprecationWarning

      - name: Verify tag matches Android version
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          python scripts/check_versions.py
          --tag "$GITHUB_REF_NAME" --platform android

  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 固定与 AGP 8.13 兼容的 Gradle 版本（仓库 wrapper 是 9.1.0, 但发布链路一直
      # 用 8.14.3; 统一升级时这里与 ci.yml / release.yml 一起改）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Run JVM unit tests
        # APK 发布前先跑 Android 单测（17 个文件 / ~1571 行, 此前从未在 CI 执行）
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build signed release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: GoGauge-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # v2.0.0-android -> 资产命名 GoGauge-v2.0.0-android.apk
          VER="${TAG#v}"; VER="${VER%-android}"
          mv app-release.apk "GoGauge-v${VER}-android.apk"
          ls -l
          gh release upload "$TAG" "GoGauge-v${VER}-android.apk" --clobber || \
            gh release create "$TAG" "GoGauge-v${VER}-android.apk" \
              --title "GoGauge $TAG" --generate-notes
