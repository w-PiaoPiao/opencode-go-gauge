# Android APK 自动构建: 推送 v*-android tag 时触发, 构建产物自动附到同名 release.
#
# ⚠️ 签名: 走"个人侧载"模式 —— 用仓库内的 android/debug.keystore 签名, 该密钥
#    与口令对所有人可见 (见 app/build.gradle.kts 的 gogauge.strictSigning), 任何
#    人都能签出同包名、同签名、可覆盖安装的伪造包. 只适合自用/小范围侧载;
#    正式分发请在仓库 Secrets 或本地提供正式 keystore 并改为严格签名.
name: release-android

on:
  push:
    tags: ["v*-android"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 仓库无 wrapper, 固定与 AGP 8.13 兼容的 Gradle 版本
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build signed release APK
        working-directory: android
        # 显式声明侧载模式: 不依赖"未提供 keystore.properties 时的默认回退",
        # 让"用公开 debug 密钥签名"成为一个写明在构建命令里的选择
        run: gradle :app:assembleRelease --no-daemon --console=plain -Pgogauge.strictSigning=false

      - uses: actions/upload-artifact@v4
        with:
          name: GoGauge-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 写权限只给真正创建/更新 release 的 job
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # v2.0.0-android -> 资产命名 GoGauge-v2.0.0-android.apk
          VER="${TAG#v}"; VER="${VER%-android}"
          mv app-release.apk "GoGauge-v${VER}-android.apk"
          ls -l
          gh release upload "$TAG" "GoGauge-v${VER}-android.apk" --clobber || \
            gh release create "$TAG" "GoGauge-v${VER}-android.apk" \
              --title "GoGauge $TAG" --generate-notes
