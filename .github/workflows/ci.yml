# 桌面端 CI: PR / push 到 main 时跑 pytest.
#
# 此前仓库只有 release workflow (单平台 + 统一发布), 全部只构建不测试 —— 约 3.5k 行 pytest 对
# 发布没有任何约束力, tag 一打就发最后一次提交的内容. 本 workflow 补上这道闸.
#
# 只覆盖桌面端 (Python); Android (gradle) 与 HarmonyOS (hvigor) 另见各自 release
# workflow, 未在此处纳入.
#
# Windows/macOS/Linux 三平台各跑一遍: 代码里有 sys.platform 分支 (登录 watcher 的
# win32 / 非 win32 路径、凭证加密的 DPAPI / 钥匙串 / 明文), 只在一平台上跑会漏掉
# 另外两条路径的回归.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # checkout v5+ / setup-python v6+ 起改用 Node 24 运行时, 消掉 "Node.js 20 is
      # deprecated" 注解 (该注解本身不判失败, 属顺手收尾).
      - uses: actions/checkout@v5
        with:
          # 只跑测试, 不需要写 token; 也不把 token 落进 .git/config
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # 只装 requirements-dev.txt (不装 requirements.txt): 被测模块 (db/server/auth/
        # backup/updater/api) 除 auth.py 顶层的 webview 外全是标准库, 而测试用空模块
        # 占位绕过 webview (见 tests/test_auth_login.py); pywebview 的图形栈没有必要
        # 拖进 runner.
        #
        # 例外是 pystray: tests/test_perf_runtime_opt.py 的托盘面板用例必须用真实
        # pystray 验证 callable/visible 求值语义, 占位模块验不出来, 故写进
        # requirements-dev.txt 由这里装上 (Windows/macOS 上真跑).
        # Linux 注意: 无头 runner 没有 appindicator/GTK/X, pystray import 时挑后端
        # 可能失败 —— 那两个用例对这种情况 pytest.skip (带原因), 不判失败.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q